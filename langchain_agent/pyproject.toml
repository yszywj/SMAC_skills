[project]
name = "smac-langchain"
version = "0.1.0"
description = "LangChain + Codex CLI high-level tactical agent over the existing SMAC skill stack"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4,<2",
  "langchain-core>=1.7,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_llm: requires a real Codex CLI login (deselected by default)",
  "live_sc2: requires StarCraft II and the SMACv2 backend (deselected by default)",
]
addopts = "-m 'not live_llm and not live_sc2'"
